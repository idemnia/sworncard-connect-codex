name: Build Windows plugin candidate
on: push
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.416
      - name: Build Windows dialog from source
        shell: powershell
        run: ./windows/build.ps1 -Output "$env:RUNNER_TEMP/SwornCardSetup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-vault-candidate
          path: ${{ runner.temp }}/SwornCardSetup.exe
          retention-days: 1
